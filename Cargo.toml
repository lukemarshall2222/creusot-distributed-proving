# Distributed proving backend for Creusot.
# Spec: .kiro/specs/creusot-distributed-proving/ (requirements.md, design.md, tasks.md).
[workspace]
resolver = "2"
members = [
    "crates/dp-core",
    "crates/dp-formats",
    "crates/dp-shell",
    "crates/dp-testkit",
    "crates/dp-frontend",
    "crates/dp-coordinator",
    "crates/dp-worker",
    "crates/dp-pool",
    "crates/dp-canon",
    "crates/dp-cert",
    "crates/dp-replay",
    "fuzz",
    "tests/canaries",
    "tests/certs",
    "tests/diff",
    "tests/integration",
    "tests/replay",
    "tests/sim",
    "tools/lock-check",
    "tools/mutants",
    "tools/patch-check",
    "tools/purity-check",
    "tools/tcb-check",
    "tools/traceability-check",
]
# The libFuzzer builds need a nightly compiler; see fuzz/libfuzzer/Cargo.toml.
exclude = ["fuzz/libfuzzer"]

[workspace.package]
version = "0.0.0"
edition = "2021"
publish = false

[workspace.dependencies]
dp-core = { path = "crates/dp-core" }
dp-formats = { path = "crates/dp-formats" }
dp-shell = { path = "crates/dp-shell" }
dp-testkit = { path = "crates/dp-testkit" }
dp-canon = { path = "crates/dp-canon" }
dp-cert = { path = "crates/dp-cert" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Hashing solver binaries is on the proving path; keep it fast in dev builds.
[profile.dev.package.sha2]
opt-level = 3
