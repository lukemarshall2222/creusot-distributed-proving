# Scheduled jobs (R7.11 job list): checks that take too long for every push.
name: sched

on:
  schedule:
    # Every night, and the mutation job on Mondays.
    - cron: "47 2 * * *"
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  # Longer runs of what ci/test runs briefly: the fuzz harnesses on many
  # more inputs from a start that changes every night, and the simulation
  # with the adversarial Coordinator on many more schedules.
  nightly:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'deps/**', 'patches/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
      - name: sched/fuzz-nightly
        run: nix develop .#ci --command cargo test --release -p dp-fuzz
        env:
          DP_FUZZ_ROUNDS: 200
          DP_FUZZ_SEED: ${{ github.run_number }}
      - name: sched/sim-nightly
        run: nix develop .#ci --command cargo test --release -p dp-sim
        env:
          DP_SIM_CASES: 5000

  mutants:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-sched-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'deps/**') }}
          restore-prefixes-first-match: nix-
          gc-max-store-size-linux: 8G
      # cargo-mutants on the soundness-critical targets, and the gate.
      - name: sched/mutants-weekly
        run: nix develop --command ci/jobs/mutants.sh
        env:
          MUTANTS_OUT: ${{ runner.temp }}/mutants
      - name: keep the outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants
          path: ${{ runner.temp }}/mutants/mutants.out/*.txt
          if-no-files-found: ignore
