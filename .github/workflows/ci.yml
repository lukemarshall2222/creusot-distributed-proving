# CI on Linux (task 1.4). Each step named ci/<job> runs ci/jobs/<job>.sh,
# which also runs on a developer machine. The jobs are those of the CI job
# list of requirements.md (R7.11); ci/traceability checks that this file
# and sched.yml define every one of them and no other.
#
# A job whose inputs do not exist yet passes with a notice; ci/traceability
# fails for a requirement row in scope that names something missing.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A Lock_File generated for this platform, when the committed one does
  # not pin it (ci/jobs/common.sh).
  DP_GENERATED_LOCK: ${{ github.workspace }}/.generated-lock.toml

jobs:
  # The gating checks. One job, so that the solvers, Why3 and Creusot are
  # built once; the first run builds them from source and takes long.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'deps/**', 'patches/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
      - name: build the CI shell
        run: nix develop .#ci --command true
      - name: ci/patches
        run: nix develop .#ci --command ci/jobs/patches.sh
      - name: ci/purity
        run: nix develop .#ci --command ci/jobs/purity.sh
      - name: ci/tcb-check
        run: nix develop .#ci --command ci/jobs/tcb-check.sh
      - name: ci/test
        run: nix develop .#ci --command ci/jobs/test.sh
      - name: ci/certs
        run: nix develop .#ci --command ci/jobs/certs.sh
      - name: ci/canaries
        run: nix develop .#ci --command ci/jobs/canaries.sh
      - name: ci/diff
        run: nix develop .#ci --command ci/jobs/diff.sh
      - name: ci/fuzz-smoke
        run: nix develop .#ci --command ci/jobs/fuzz-smoke.sh
      - name: ci/sim
        run: nix develop .#ci --command ci/jobs/sim.sh
      - name: ci/replay
        run: nix develop .#ci --command ci/jobs/replay.sh
      - name: ci/integration-cluster
        run: nix develop .#ci --command ci/jobs/integration-cluster.sh
      - name: ci/creusot
        run: nix develop .#ci --command ci/jobs/creusot.sh
      - name: ci/tlc
        run: nix develop .#ci --command ci/jobs/tlc.sh
      - name: ci/trace-validation
        run: nix develop .#ci --command ci/jobs/trace-validation.sh
      - name: ci/lean
        run: nix develop .#ci --command ci/jobs/lean.sh
        env:
          DP_REQUIRE_LEAN: 1
      - name: ci/lean-partition
        run: nix develop .#ci --command ci/jobs/lean-partition.sh
      - name: ci/corpus-check
        run: nix develop .#ci --command ci/jobs/corpus-check.sh
      - name: ci/eval-smoke
        run: nix develop .#ci --command ci/jobs/eval-smoke.sh
      - name: ci/eval-report
        run: nix develop .#ci --command ci/jobs/eval-report.sh
      - name: keep the Lock_File generated for this platform
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lock-${{ runner.os }}-${{ runner.arch }}
          path: .generated-lock.toml
          include-hidden-files: true
          if-no-files-found: ignore

  # Reported, not gating yet: Kani has not been built on Linux by this
  # flake. Once this passes, it moves into the gating job.
  kani:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: ci/kani
        run: nix develop --command ci/jobs/kani.sh

  # Reported, not gating yet: whether the builds are bit-for-bit reproducible
  # on Linux is not known (they are not on macOS). Once this passes, it gates.
  repro-build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: ci/repro-build
        run: ci/jobs/repro-build.sh

  # After every other ci/ job has ended (R7.11 criterion 9), whatever the
  # two jobs that do not gate yet reported.
  traceability:
    needs: [checks, kani, repro-build]
    if: ${{ !cancelled() && needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'deps/**', 'patches/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: ci/traceability
        run: nix develop .#ci --command ci/jobs/traceability.sh

  # Reported, not gating yet: the pinned tools that no check uses so far and
  # the OCI images of the integration cluster. None has been built on Linux.
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: build the remaining tools and the cluster images
        run: |
          status=0
          for package in ethos carcara cpc-signature kani apalache lean cargo-mutants \
                         image-coordinator image-pool image-worker; do
            if nix build ".#$package" --no-link; then echo "built: $package"; else echo "FAILED: $package"; status=1; fi
          done
          exit $status
