[package]
name = "dp-replay-tests"
description = "End-to-end tests of the Replay_Tool on honest and on tampered files (R7.6)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
dp-formats.workspace = true
dp-cert.workspace = true
serde_json = { version = "1", features = ["preserve_order"] }

[[test]]
name = "replay"
path = "main.rs"

[[test]]
name = "tamper"
path = "tamper/main.rs"

[lints]
workspace = true
