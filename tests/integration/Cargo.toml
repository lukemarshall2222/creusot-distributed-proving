[package]
name = "dp-integration"
description = "End-to-end tests of the System through Creusot_CLI (design: Testing Strategy)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dev-dependencies]
dp-core.workspace = true
dp-cert.workspace = true
dp-formats.workspace = true
dp-coordinator = { path = "../../crates/dp-coordinator" }
dp-shell = { workspace = true, features = ["cluster"] }
serde_json = "1"

[[test]]
name = "cli_labels"
path = "cli_labels/main.rs"

[[test]]
name = "cluster"
path = "cluster/main.rs"

[[test]]
name = "certs_store_faults"
path = "certs/store_faults.rs"

[[test]]
name = "pins"
path = "pins/main.rs"

[lints]
workspace = true
