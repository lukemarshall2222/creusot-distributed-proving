# The format registry (R7.10): for each exchanged format its grammar file,
# its codec module, its round-trip test, its fuzz target and its size
# limit in bytes. `ci/traceability` fails when an entry names something
# that does not exist, and when a format that a requirement in scope is
# cited for is neither registered nor pending.
#
# [[pending]] names a format that is owed and cannot be registered yet,
# with the parts that do not exist and the reason. Pending records do not
# fail the check; every run prints them.

[[format]]
name = "result-message"
grammar = "docs/formats/result-message.abnf"
codec = "crates/dp-formats/src/cluster.rs"
roundtrip = "crates/dp-formats/tests/prop_cluster.rs"
fuzz = "fuzz/result_message/"
size_limit = "268435456"

