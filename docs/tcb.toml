# The TCB_Document (R7.8). The items are derived from requirements.md by
# `cargo run -p tcb-check -- --write`; the tools, their reasons and the
# every_label marks are written by hand. `ci/tcb` checks both.

information_order = [
    "standalone-invalid",
    "checked-incomplete",
    "unchecked",
    "dependent-invalid",
    "timeout",
    "unknown",
    "failed",
    "unresolved",
]

[[tool]]
name = "alt-ergo"
trusted_for = "proved-standalone, when its binary is the pinned Unpatched_Solver"
items = ["NG-3"]
reason = "An Unpatched_Solver: its answer Valid on the local print is taken as a proof. Not verified; certify-all mode removes this trust."

[[tool]]
name = "z3"
trusted_for = "proved-standalone, when its binary is the pinned Unpatched_Solver"
items = ["NG-3"]
reason = "An Unpatched_Solver, as Alt-Ergo."

[[tool]]
name = "cvc5"
trusted_for = "proved-standalone, when its binary is the pinned Unpatched_Solver; nothing as a proof producer"
items = ["NG-3"]
reason = "An Unpatched_Solver, as Alt-Ergo. The certificates that it produces are untrusted: the checker decides."

[[tool]]
name = "cvc4"
trusted_for = "proved-standalone, when its binary is the pinned Unpatched_Solver"
items = ["NG-3"]
reason = "An Unpatched_Solver, as Alt-Ergo."

[[tool]]
name = "ethos"
trusted_for = "certified"
items = ["NG-4"]
reason = "The Certificate_Checker: a certificate that it accepts against the local print gives the label certified."

[[tool]]
name = "cpc-signature"
trusted_for = "certified"
items = ["NG-4"]
reason = "The rules that Ethos checks CPC proofs against; a wrong rule would let a wrong proof pass."

[[tool]]
name = "why3find-dispatch"
trusted_for = "every label"
items = ["NG-2"]
reason = "Prints every Goal and counts its tasks (TB-23): every label is bound to its print. The dispatch patch is part of what is trusted."

[[tool]]
name = "creusot"
trusted_for = "every label"
items = [
    "NG-1",
    "NG-4",
]
reason = "Translates the Rust source to the Goals that are proved, and starts the Front_End through the backend patch."

